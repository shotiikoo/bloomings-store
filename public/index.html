se in a paper wrap.","dk":"ერთი გრძელღეროიანი ვარდი ქაღალდის შეფუთვაში.","p":12,"cat":"Roses","catK":"ვარდები","k":["#FE6F61"],"img":"","inStock":true,"active":true},{"id":"b4","n":"Peach Meadow","nk":"ატმისფერი მდელო","d":"Mixed seasonal flowers in jasmine and pink.","dk":"სეზონური შერეული ყვავილები ყვითელ და ვარდისფერ ტონებში.","p":60,"cat":"Mixed","catK":"შერეული","k":["#FFD581","#FF99A4","#FE6F61","#FFD581"],"img":"","inStock":true,"active":true},{"id":"b5","n":"Wild Morning","nk":"ველური დილა","d":"Loose field-style bunch, changes with the season.","dk":"ველის სტილის თავისუფალი თაიგული, სეზონის მიხედვით იცვლება.","p":48,"cat":"Mixed","catK":"შერეული","k":["#FF99A4","#FFD581","#FE6F61"],"img":"","inStock":true,"active":true},{"id":"b6","n":"Coral Crush","nk":"მარჯნისფერი ვნება","d":"Bold coral blooms with pink accents.","dk":"თამამი მარჯნისფერი ყვავილები ვარდისფერი აქცენტებით.","p":75,"cat":"Mixed","catK":"შერეული","k":["#FE6F61","#FF99A4","#FE6F61","#FFD581"],"img":"","inStock":true,"active":true},{"id":"b7","n":"Thank You Box","nk":"მადლობის ყუთი","d":"Small rose box with a handwritten card.","dk":"პატარა ყუთი ვარდებით და ხელნაწერი ბარათით.","p":55,"cat":"Gifts","catK":"საჩუქრები","k":["#FF99A4","#FF99A4","#FFD581"],"img":"","inStock":true,"active":true},{"id":"b8","n":"Birthday Basket","nk":"დაბადების დღის კალათა","d":"Basket of mixed roses, ready to give.","dk":"შერეული ვარდების კალათა, საჩუქრად მზად.","p":95,"cat":"Gifts","catK":"საჩუქრები","k":["#FFD581","#FF99A4","#FE6F61","#FF99A4","#FFD581"],"img":"","inStock":true,"active":true}]};
const price=(q,s)=>FL.reduce((s2,f)=>s2+(q[f.id]||0)*f.p,0)+SVC+ST[s||0].x;
const iname=x=>x.custom?t("cName")+" · "+x.n+" "+t("stems"):pn(x);
const idetail=x=>FL.filter(f=>x.q[f.id]).map(f=>L2(f)+" ×"+x.q[f.id]).join(", ")+` · ${L2(ST.find(s=>s.id==x.sid)||ST[0])}, ${L2(WR[x.wrap])} · ${t("ribH")}: ${L2(RB[x.rib])}`+(x.note?` · “${x.note}”`:"");
const bumpCart=()=>{const o=$("#open");o.classList.remove("bump");void o.offsetWidth;o.classList.add("bump")};
function head(f,x,y,r){x=x.toFixed(1);y=y.toFixed(1);const s='stroke="rgba(74,36,21,.35)" stroke-width="1.5"';
if(f.kind=="daisy")return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${s}/><circle cx="${x}" cy="${y}" r="${r*.4}" fill="#FFD581"/>`;
if(f.kind=="gerbera")return `<circle cx="${x}" cy="${y}" r="${r}" fill="${f.c}" ${s}/><circle cx="${x}" cy="${y}" r="${r*.62}" fill="rgba(255,255,255,.35)"/><circle cx="${x}" cy="${y}" r="${r*.28}" fill="#4A2415"/>`;
return `<circle cx="${x}" cy="${y}" r="${r}" fill="${f.c}" ${s}/><circle cx="${x}" cy="${y}" r="${r*.58}" fill="rgba(255,255,255,.28)"/><path d="M${x-r*.35} ${y} a${r*.35} ${r*.35} 0 1 1 ${r*.5} ${r*.3}" fill="none" stroke="rgba(74,36,21,.5)" stroke-width="1.6"/>`}
const bow=(dy,L)=>`<g transform="translate(0 ${dy})"><path d="M146 206L136 ${206+L}l12-6zM154 206l10 ${L}-12-6z" fill="RB" stroke="rgba(0,0,0,.2)"/><path d="M150 204c-12-24-42-22-40-4s30 20 40 4zM150 204c12-24 42-22 40-4s-30 20-40 4z" fill="RB" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/><circle cx="150" cy="204" r="7" fill="RB" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/></g>`;
function shape(s,w,rb){const ln='stroke="rgba(0,0,0,.22)" stroke-width="2"';let b="",f="";
if(s==1){b=`<ellipse cx="150" cy="180" rx="80" ry="14" fill="${w}" ${ln}/><ellipse cx="150" cy="180" rx="74" ry="11" fill="rgba(0,0,0,.4)"/>`;
f=`<path d="M70 180V272a80 14 0 0 0 160 0V180a80 14 0 0 1-160 0z" fill="${w}" ${ln}/><path d="M70 180a80 14 0 0 0 160 0" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/><path d="M70 224a80 14 0 0 0 160 0v16a80 14 0 0 1-160 0z" fill="${rb}" ${ln}/>`+bow(36,24)}
else if(s==2){b=`<path d="M70 184C52 20 248 20 230 184" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="12" stroke-linecap="round"/><path d="M70 184C52 20 248 20 230 184" fill="none" stroke="${w}" stroke-width="8" stroke-linecap="round"/>`;
f=`<path d="M60 182H240L220 282Q150 292 80 282z" fill="${w}" ${ln}/><path d="M64 204H236M68 226H232M73 248H227M77 268H223M90 182L103 284M120 182L127 284M150 182V284M180 182L173 284M210 182L197 284" stroke="rgba(0,0,0,.16)" stroke-width="2" fill="none"/><rect x="56" y="176" width="188" height="10" rx="5" fill="${w}" ${ln}/><path d="M66 214H234L231 230H69z" fill="${rb}" ${ln}/>`+bow(18,22)}
else if(s==3){b=`<path d="M150 178L128 268M150 178L150 276M150 178L172 268" stroke="#6F8F5A" stroke-width="3" fill="none"/>`;
f=`<path d="M112 184Q68 220 90 262Q100 288 150 289Q200 288 210 262Q232 220 188 184z" fill="${w}" fill-opacity=".38" stroke="rgba(0,0,0,.3)" stroke-width="2"/><path d="M104 232Q96 250 106 270" stroke="rgba(255,255,255,.75)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M114 186Q150 196 186 186V198Q150 208 114 198z" fill="${rb}" ${ln}/>`+bow(-6,30)}
else{b=`<polygon points="52,104 248,104 176,290 124,290" fill="${w}" ${ln}/>`;
f=`<polygon points="78,150 150,138 222,150 176,290 124,290" fill="${w}" ${ln}/><polygon points="78,150 150,138 150,290 124,290" fill="rgba(255,255,255,.25)"/><path d="M150 138V290" stroke="rgba(0,0,0,.12)" stroke-width="2"/>`+bow(0,46)}
return{b,f:f.replace(/fill="RB"/g,`fill="${rb}"`)}}
function bsvg(){
const w=WR[bs.wrap].c,rb=RB[bs.rib].c,pool=FL.map(f=>({f,n:bs.q[f.id]||0})),seq=[];
while(pool.some(x=>x.n>0))pool.forEach(x=>{if(x.n>0){seq.push(x.f);x.n--}});
const gr=seq.filter(f=>f.kind=="greenery"),hd=seq.filter(f=>f.kind!="greenery"),m=hd.length,hr=Math.min(28,Math.max(5.5,95/Math.sqrt(m||1)));
const pts=hd.map((f,i)=>{const q=Math.sqrt((i+.5)/m),a=i*2.39996;return{f,x:150+92*q*Math.cos(a),y:100+64*q*Math.sin(a)}}).sort((a,b)=>a.y-b.y);
const st=pts.map(o=>`<line x1="150" y1="178" x2="${o.x.toFixed(1)}" y2="${o.y.toFixed(1)}" stroke="#6F8F5A" stroke-width="3"/>`).join("");
const lv=gr.map((f,i)=>{const th=gr.length>1?-70+140*i/(gr.length-1):0,a=th*Math.PI/180,lx=150+98*Math.sin(a),ly=178-98*Math.cos(a);
return `<line x1="150" y1="178" x2="${lx.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#6F8F5A" stroke-width="3"/><ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="11" ry="32" fill="#8FB07A" stroke="rgba(0,0,0,.25)" stroke-width="1.5" transform="rotate(${th} ${lx.toFixed(1)} ${ly.toFixed(1)})"/>`}).join("");
const hs=pts.map((o,i)=>o.f.img?`<clipPath id="hc${i}"><circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="${hr}"/></clipPath><image href="${esc(o.f.img)}" x="${(o.x-hr).toFixed(1)}" y="${(o.y-hr).toFixed(1)}" width="${(hr*2).toFixed(1)}" height="${(hr*2).toFixed(1)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#hc${i})"/><circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="${hr}" fill="none" stroke="#fff" stroke-width="1.5"/>`:head(o.f,o.x,o.y,hr)).join("");
const S=shape(ST[bs.style].shape,w,rb);
return `<svg viewBox="0 0 300 300" role="img" aria-label="${t("bTitle")}">${S.b}${lv}${st}${hs}${S.f}</svg>`}
function upd(){
FL.forEach(f=>{const e=$("#q_"+f.id);if(e)e.value=bs.q[f.id]||0});
document.querySelectorAll("#wsw .sw").forEach((b,i)=>b.setAttribute("aria-pressed",i==bs.wrap));
document.querySelectorAll("#rsw .sw").forEach((b,i)=>b.setAttribute("aria-pressed",i==bs.rib));
document.querySelectorAll("#ssw .sty").forEach((b,i)=>{b.setAttribute("aria-pressed",i==bs.style);const S=shape(ST[i].shape,WR[bs.wrap].c,RB[bs.rib].c);b.querySelector(".th").innerHTML=`<svg viewBox="40 125 220 170" aria-hidden="true">${S.b}${S.f}</svg>`});
$("#sn").textContent=L2(ST[bs.style])+(ST[bs.style].x?" +"+gel(ST[bs.style].x):"");$("#wn").textContent=L2(WR[bs.wrap]);$("#rn").textContent=L2(RB[bs.rib]);
const n=stems();$("#bsvg").innerHTML=bsvg();
$("#bcount").textContent=n+" "+t("stems");$("#btotal").textContent=gel(n?price(bs.q,bs.style):0);
$("#badd").disabled=n<MINS;$("#bhint").textContent=n==0?t("bEmpty"):n<MINS?t("bMin"):""}
function buildUI(){
$("#bctl").innerHTML=`<h3>${t("bFl")}</h3>`+FL.map(f=>`<div class="fr${f.inStock?"":" sold"}">${f.img?`<button type="button" class="fth" data-zf="${esc(f.id)}" aria-label="${esc(L2(f))}"><img src="${esc(f.img)}" alt="" loading="lazy"></button>`:`<span class="dot" style="background:${esc(f.c)}"></span>`}<span class="fn">${esc(L2(f))}<small>${f.inStock?gel(f.p)+" "+t("perStem"):t("sold")}</small></span><div class="q"><button type="button" data-f="${esc(f.id)}" data-d="-1" aria-label="${t("rm")}: ${esc(L2(f))}">−</button><input class="qn" id="q_${esc(f.id)}" type="number" inputmode="numeric" min="0" max="${MAXS}" value="0" aria-label="${esc(L2(f))}"${f.inStock?"":" disabled"}><button type="button" data-f="${esc(f.id)}" data-d="1" aria-label="${t("ad1")}: ${esc(L2(f))}"${f.inStock?"":" disabled"}>+</button></div></div>`).join("")+
`<h3>${t("styleH")} <small id="sn"></small></h3><div class="stys" id="ssw">${ST.map((s,i)=>`<button type="button" class="sty" data-s="${i}" aria-pressed="false"><span class="th"></span><span>${esc(L2(s))}</span></button>`).join("")}</div>
<h3>${t("wrapH")} <small id="wn"></small></h3><div class="sws" id="wsw">${WR.map((w,i)=>`<button type="button" class="sw" data-w="${i}" style="background:${w.c}" aria-label="${L2(w)}" aria-pressed="false"></button>`).join("")}</div>
<h3>${t("ribH")} <small id="rn"></small></h3><div class="sws" id="rsw">${RB.map((w,i)=>`<button type="button" class="sw" data-r="${i}" style="background:${w.c}" aria-label="${L2(w)}" aria-pressed="false"></button>`).join("")}</div>
<label for="bnote">${t("bNote")}</label><input id="bnote" maxlength="60" value="${esc(bs.note)}">
<p class="bsvc">${t("bSvc")}: ${gel(SVC)}</p>
<div class="bact"><button type="button" class="btn alt" id="bclear">${t("bClear")}</button><button type="button" class="btn" id="badd">${t("bAdd")}</button></div>`;
upd()}
$("#bctl").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;if(d.zf){zoomF(d.zf);return}
if(d.f){const v=(bs.q[d.f]||0)+ +d.d;if(v<0)return;if(+d.d>0&&stems()>=MAXS){upd();$("#bhint").textContent=t("bMax");return}bs.q[d.f]=v;upd()}
else if(d.s!=null){bs.style=+d.s;upd()}else if(d.w!=null){bs.wrap=+d.w;upd()}else if(d.r!=null){bs.rib=+d.r;upd()}
else if(b.id=="bclear"){bs.q={};upd()}else if(b.id=="badd")addCustom()};
$("#bctl").oninput=e=>{if(e.target.id=="bnote")bs.note=e.target.value};
$("#bctl").onchange=e=>{const el=e.target;if(!el.classList.contains("qn"))return;const id=el.id.slice(2);let v=Math.max(0,Math.floor(+el.value)||0),cl=false;const o=stems()-(bs.q[id]||0);if(o+v>MAXS){v=MAXS-o;cl=true}bs.q[id]=v;upd();if(cl)$("#bhint").textContent=t("bMax")};
function addCustom(){const n=stems();if(n<MINS)return;const k="c"+(++cn);
C[k]={custom:true,id:k,sid:ST[bs.style].id,n,p:price(bs.q,bs.style),q:{...bs.q},style:bs.style,wrap:bs.wrap,rib:bs.rib,note:bs.note.trim()};
cart[k]=1;done=false;render();bumpCart();openCart()}
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.chip,.lang button,.q button,.x,.sty,.opt,.sw");if(!b||b.disabled)return;
if(!b.matches(".sw,.opt")){const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement("span");s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),700)}
b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");if(b.classList.contains("btn")){b.classList.add("shine");setTimeout(()=>b.classList.remove("shine"),700)}
setTimeout(()=>b.classList.remove("pop"),450)},{passive:true});
function applyCatalog(c){const S=c.settings;FEE=S.deliveryFee;SVC=S.serviceFee;MINS=S.minStems;MAXS=S.maxStems;OPEN=S.openHour;CLOSE=S.closeHour;P=c.bouquets;FL=c.flowers;ST=c.styles;
if(bs.style>=ST.length)bs.style=0;
for(const k of Object.keys(bs.q)){const f=FL.find(x=>x.id==k);if(!f||!f.inStock)delete bs.q[k]}
for(const k of Object.keys(cart)){if(k[0]!="c"&&!P.some(p=>p.id==k))delete cart[k]}
if(cat!="All"&&!P.some(p=>p.cat==cat))cat="All"}
function loadCatalog(){return fetch("/api/catalog",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(c=>{if(!c||!Array.isArray(c.bouquets))return Promise.reject();LIVE=true;applyCatalog(c);statics()}).catch(()=>{})}
applyCatalog(DEF);statics();loadCatalog();
</script>
